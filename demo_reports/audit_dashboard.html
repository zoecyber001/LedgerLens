).", "reference": "NDPA 2023 S.29 (Database PII Encryption)"}, {"rule_id": "FIN-PII-002", "title": "Plaintext Card PAN / CVV Column Definition", "description": "Checks columns named card_number, card_pan, pan, cvv, card_cvv defined as plaintext VARCHAR/TEXT/INT.", "framework": "NDPA 2023 S.29 (Database PII Encryption)", "risk_tier": "CRITICAL", "file_path": "/home/zoecyber/LedgerLens/demo_db/schema.sql", "line_number": null, "table_name": "customer_identities", "column_name": "card_pan", "code_snippet": "", "remediation": "Never store raw Card PAN or CVV in database tables. Use tokenization via PCI-DSS compliant payment gateway.", "reference": "NDPA 2023 S.29 & PCI-DSS v4.0 Requirements"}, {"rule_id": "FIN-IMM-001", "title": "Missing Immutability Triggers / Mutable Ledger", "description": "Checks if financial ledger tables (ledger, transaction, journal_entry, payment_log) lack triggers or policies preventing UPDATE or DELETE operations.", "framework": "CBN e-Payment Guidelines (PSPs/MMOs)", "risk_tier": "CRITICAL", "file_path": "/home/zoecyber/LedgerLens/demo_db/schema.sql", "line_number": null, "table_name": "wallet_ledger", "column_name": null, "code_snippet": "", "remediation": "Implement BEFORE UPDATE OR DELETE triggers that raise exceptions to enforce append-only immutable ledgers.", "reference": "CBN e-Payment Guidelines (PSPs/MMOs)"}, {"rule_id": "FIN-IMM-002", "title": "Missing Immutable Timestamps", "description": "Checks if ledger tables lack created_at or timestamp default constraints (DEFAULT CURRENT_TIMESTAMP / DEFAULT NOW()).", "framework": "CBN Risk-Based Cybersecurity Framework", "risk_tier": "HIGH", "file_path": "/home/zoecyber/LedgerLens/demo_db/schema.sql", "line_number": null, "table_name": "wallet_ledger", "column_name": null, "code_snippet": "", "remediation": "Add created_at timestamp column with DEFAULT CURRENT_TIMESTAMP constraint.", "reference": "CBN Risk-Based Cybersecurity Framework"}, {"rule_id": "FIN-CBN-001", "title": "Missing Audit Trail Logging", "description": "Checks for missing audit log tables or CDC (Change Data Capture) configuration in database schema.", "framework": "CBN e-Payment Guidelines (PSPs/MMOs)", "risk_tier": "HIGH", "file_path": "/home/zoecyber/LedgerLens/demo_db/schema.sql", "line_number": null, "table_name": null, "column_name": null, "code_snippet": "", "remediation": "Configure dedicated audit_log table with trigger-based CDC for all balance mutations per CBN guidelines.", "reference": "CBN e-Payment Guidelines (PSPs/MMOs)"}];

            const query = document.getElementById('searchInput').value.toLowerCase();
            const list = document.getElementById('findingsList');

            const filtered = findings.filter(f => {
                const matchTier = currentTier === 'ALL' || f.risk_tier === currentTier;
                const matchQuery = !query || 
                    f.title.toLowerCase().includes(query) || 
                    f.rule_id.toLowerCase().includes(query) || 
                    (f.table_name && f.table_name.toLowerCase().includes(query)) ||
                    f.description.toLowerCase().includes(query);
                return matchTier && matchQuery;
            });

            if (filtered.length === 0) {
                list.innerHTML = '<div style="text-align:center; padding:3rem; color:var(--text-muted);">No compliance findings match the selected filter.</div>';
                return;
            }

            filtered.forEach(f => {
                const card = document.createElement('div');
                card.className = `finding-card ${f.risk_tier}`;
                card.innerHTML = `
