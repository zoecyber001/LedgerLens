name: LedgerLens Audit & Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

jobs:
  audit-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run Unit Tests
        run: |
          PYTHONPATH=. python tests/run_tests.py

      - name: Run LedgerLens Financial Audit
        run: |
          ledgerlens audit-ledger . --output ./reports --format all

      - name: Upload SARIF Audit Report to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: ./reports/ledgerlens_audit.sarif
          category: ledgerlens-audit
